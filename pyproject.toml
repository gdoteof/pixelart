[project]
name = "pixelart"
version = "0.1.0"
description = "Tooling for procedurally drawn pixel-art music videos"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    "pillow>=11.3,<12",   # 12.x rasterises some ellipses/polygons differently from the alt-f4 render
]

[project.optional-dependencies]
# Offline song analysis: stems (Demucs), beats (beat_this), transcription (faster-whisper on CUDA).
audio = [
    "beat-this>=1.1",
    "demucs>=4.0",
    "faster-whisper>=1.2",
    "librosa>=0.10",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    "soundfile",
    "torch>=2.7,<2.8",
    "torchaudio>=2.7,<2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixelart"]

# Demucs and beat_this run fine on CPU; faster-whisper uses CUDA through the nvidia-* wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
